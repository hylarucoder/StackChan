[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackchan-server"
version = "0.1.0"
description = "FastAPI backend and XiaoZhi bridge for StackChan hardware demos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "StackChan maintainers" },
]
dependencies = [
    "agora-agent-server-sdk>=2.2.0",
    "agora-python-server-sdk>=2.4.6",
    "agora-token-builder>=1.0.0",
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "fastapi>=0.100.0",
    "numpy>=1.26",
    "opuslib>=3.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "uvicorn>=0.20.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
choreo = [
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.scripts]
stackchan-server = "stackchan_server.main:main"
stackchan-native-agent-api = "stackchan_server.apps.native_agent_api:main"
stackchan-xiaozhi-bridge = "stackchan_server.xiaozhi.app:main"
stackchan-choreograph = "stackchan_server.stackchan.choreography.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["stackchan_server*"]

[tool.setuptools.package-data]
stackchan_server = [
    "static/dance/dance.json",
    "static/dance/choreographer/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
